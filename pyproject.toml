[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "techgar"
version = "1.1.0"
description = "Indoor multi-camera vehicle tracking, parking and driver guidance"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]
video = [
  "opencv-python-headless>=4.10,<5",
]

[project.scripts]
techgar-api = "techgar.api:main"
techgar-benchmark = "techgar.evaluation.cli:main"
techgar-site-audit = "techgar.site_assets:main"
techgar-demo = "techgar.demo:main"
techgar-identity-audit = "techgar.identity_audit:main"

[tool.setuptools.packages.find]
include = ["techgar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["techgar"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
