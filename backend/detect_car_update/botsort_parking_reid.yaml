# BoT-SORT tối ưu cho camera bãi xe cố định.
# Re-ID giúp giữ ID xe qua che khuất ngắn; tắt nếu máy không đủ GPU/CPU.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.35
track_buffer: 90
match_thresh: 0.80
fuse_score: true

# Camera cố định: không cần ước lượng chuyển động camera.
gmc_method: none

# Re-ID chỉ so ngoại hình khi bbox còn đủ gần, hạn chế gán nhầm xe khác.
proximity_thresh: 0.50
appearance_thresh: 0.25
with_reid: true
model: auto
